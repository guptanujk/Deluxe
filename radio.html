<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DELUXE RADIO</title>
<link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230d0c0b'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Arial,sans-serif' font-size='68' font-weight='900' fill='%23f5f2ea'%3ED%3C/text%3E%3C/svg%3E"
>

<style>

/* =================================================
   FONTS
================================================= */

@import url(
    'https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap'
);


/* =================================================
   RESET
================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


/* =================================================
   BASE
================================================= */

html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    background: #0b0b0b;

    color: #f5f2ea;

    font-family: Inter, sans-serif;

    overflow-x: hidden;

}


/* =================================================
   HEADER
================================================= */

header {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 76px;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 5vw;

    background: rgba(11,11,11,.72);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);

}


.logo {

    color: #f5f2ea;

    text-decoration: none;

    font-size: 24px;

    font-weight: 900;

    letter-spacing: -1px;

}


.logo span {

    font-weight: 400;

}


.back {

    color: #777;

    text-decoration: none;

    font-family: "DM Mono", monospace;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    transition: color .3s ease;

}


.back:hover {

    color: white;

}


/* =================================================
   RADIO
================================================= */

.radio {

    min-height: 100vh;

    padding:
        135px 20px
        100px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.08),
            transparent 32%
        ),
        #0b0b0b;

}


.eyebrow {

    font-family: "DM Mono", monospace;

    font-size: 11px;

    color: #777;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 25px;

}


h1 {

    font-size: clamp(
        55px,
        9vw,
        110px
    );

    line-height: .9;

    letter-spacing: -6px;

    font-weight: 900;

}


.subtitle {

    margin-top: 20px;

    color: #777;

    font-size: 14px;

}


/* =================================================
   VINYL
================================================= */

.vinyl-container {

    width: 370px;

    height: 370px;

    margin: 65px auto 25px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.vinyl {

    appearance: none;

    border: 0;

    padding: 0;

    width: 340px;

    height: 340px;

    border-radius: 50%;

    position: relative;

    cursor: pointer;

    background:

        conic-gradient(
            from 15deg,
            rgba(255,255,255,.08),
            rgba(220,190,160,.04) 12%,
            rgba(255,220,190,.10) 22%,
            rgba(170,200,220,.07) 34%,
            rgba(255,255,255,.03) 48%,
            rgba(210,180,150,.09) 61%,
            rgba(160,190,210,.06) 74%,
            rgba(255,255,255,.05) 88%,
            rgba(220,190,160,.08)
        ),

        repeating-radial-gradient(
            circle,
            #171717 0px,
            #171717 2px,
            #090909 3px,
            #090909 5px
        );

    box-shadow:

        0 0 0 5px #111,

        0 0 55px rgba(181,164,134,.08),

        0 35px 80px rgba(0,0,0,.72);

    transition:
        box-shadow .4s ease;

}


.vinyl:hover {

    box-shadow:

        0 0 0 5px #111,

        0 0 70px rgba(181,164,134,.13),

        0 35px 80px rgba(0,0,0,.72);

}


.vinyl.playing {

    animation:
        spin 3s linear infinite;

}


@keyframes spin {

    from {

        transform: rotate(0deg);

    }

    to {

        transform: rotate(360deg);

    }

}


.vinyl::before {

    content: "";

    position: absolute;

    width: 94px;

    height: 94px;

    border-radius: 50%;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    background: #b5a486;

    box-shadow:
        0 0 0 3px rgba(0,0,0,.18);

}


.vinyl-label {

    position: absolute;

    z-index: 2;

    width: 94px;

    height: 94px;

    border-radius: 50%;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;

    justify-content: center;

    color: #171513;

    font-family:
        "DM Mono",
        monospace;

    font-size: 9px;

    letter-spacing: 1.5px;

}


.vinyl-hole {

    position: absolute;

    z-index: 3;

    width: 9px;

    height: 9px;

    border-radius: 50%;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    background: #111;

}


/* =================================================
   SONG
================================================= */

.song {

    margin-top: 5px;

}


.song-title {

    font-size: 19px;

    font-weight: 600;

}


.song-artist {

    margin-top: 8px;

    color: #777;

    font-size: 12px;

}


.status {

    min-height: 20px;

    margin-top: 20px;

    padding: 10px 18px;

    border:
        1px solid rgba(255,255,255,.16);

    border-radius: 999px;

    background:
        transparent;

    color: #777;

    font-family:
        "DM Mono",
        monospace;

    font-size: 10px;

    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;

}


.status:hover {

    color: #f5f2ea;

    border-color:
        rgba(255,255,255,.35);

    transform:
        translateY(-2px);

}


.status:active {

    transform:
        translateY(0);

}


.status.playing {

    color: #f5f2ea;

    border-color:
        rgba(181,164,134,.55);

}


/* =================================================
   FOOTER
================================================= */

footer {

    padding: 35px 5vw 60px;

    text-align: center;

    color: #555;

    font-family:
        "DM Mono",
        monospace;

    font-size: 10px;

    letter-spacing: 1px;

}


/* =================================================
   MOBILE
================================================= */


/* =================================================
   DAILY RECORD ATMOSPHERE
================================================= */

body {

    --song-glow: rgba(188, 145, 91, .16);

    background:
        radial-gradient(
            circle at 50% 42%,
            var(--song-glow),
            transparent 34%
        ),
        #0b0b0b;

}


.radio {

    position: relative;

    isolation: isolate;

    overflow: hidden;

}


.radio::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: -2;

    pointer-events: none;

    opacity: .18;

    background-image:
        radial-gradient(
            rgba(255,255,255,.35) .6px,
            transparent .6px
        );

    background-size: 4px 4px;

    animation: filmGrain .18s steps(2) infinite;

}


.radio::after {

    content: "";

    position: absolute;

    width: 620px;

    height: 620px;

    left: 50%;

    top: 52%;

    transform:
        translate(-50%, -50%);

    z-index: -1;

    pointer-events: none;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(181,164,134,.10),
            transparent 67%
        );

    filter: blur(25px);

}


@keyframes filmGrain {

    0% {
        transform: translate(0, 0);
    }

    25% {
        transform: translate(-1%, 1%);
    }

    50% {
        transform: translate(1%, -1%);
    }

    75% {
        transform: translate(1%, 1%);
    }

    100% {
        transform: translate(-1%, -1%);
    }

}


.song-kicker {

    margin-bottom: 12px;

    color: #777;

    font-family:
        "DM Mono",
        monospace;

    font-size: 9px;

    letter-spacing: 3px;

}


.song-title {

    font-size: clamp(
        22px,
        3vw,
        32px
    );

    letter-spacing: -1px;

}


.song-note {

    margin-top: 15px;

    color: #555;

    font-size: 11px;

    font-family:
        "DM Mono",
        monospace;

    letter-spacing: .5px;

}


.vinyl-container {

    position: relative;

}


.vinyl-container::before,
.vinyl-container::after {

    content: "";

    position: absolute;

    border-radius: 50%;

    pointer-events: none;

}


.vinyl-container::before {

    width: 390px;

    height: 390px;

    border:
        1px solid rgba(181,164,134,.10);

}


.vinyl-container::after {

    width: 420px;

    height: 420px;

    border:
        1px solid rgba(255,255,255,.035);

    animation:
        pulseRing 4s ease-in-out infinite;

}


@keyframes pulseRing {

    0%,
    100% {

        transform: scale(.98);

        opacity: .35;

    }

    50% {

        transform: scale(1.03);

        opacity: .8;

    }

}


.vinyl.playing {

    animation:
        spin 3s linear infinite,
        vinylGlow 2.8s ease-in-out infinite;

}


@keyframes vinylGlow {

    0%,
    100% {

        box-shadow:
            0 0 0 5px #111,
            0 0 55px rgba(181,164,134,.08),
            0 35px 80px rgba(0,0,0,.72);

    }

    50% {

        box-shadow:
            0 0 0 5px #111,
            0 0 95px rgba(181,164,134,.20),
            0 35px 80px rgba(0,0,0,.72);

    }

}


@media (max-width: 600px) {

    .vinyl-container::before {

        width: 285px;

        height: 285px;

    }


    .vinyl-container::after {

        width: 310px;

        height: 310px;

    }

}


@media (max-width: 600px) {

    header {

        padding: 0 20px;

    }


    .radio {

        padding-top: 120px;

    }


    h1 {

        letter-spacing: -4px;

    }


    .vinyl-container {

        width: 280px;

        height: 280px;

        margin-top: 55px;

    }


    .vinyl {

        width: 255px;

        height: 255px;

    }


    .vinyl::before,
    .vinyl-label {

        width: 76px;

        height: 76px;

    }


    .vinyl-label {

        font-size: 7px;

    }

}

</style>

</head>


<body>


<header>

    <a
        class="logo"
        href="index.html"
    >
        DELUXE<span>.</span>
    </a>


    <a
        class="back"
        href="index.html"
    >
        ← Experiences
    </a>

</header>



<main class="radio">

    <div class="eyebrow" id="era">
        A SONG FROM ANOTHER TIME
    </div>


    <h1 id="radioHeading">
        HAM TERE<br> PYAAR ME
    </h1>


    <p class="subtitle" id="mood">
        ROMANCE / NOSTALGIA
    </p>



    <div class="vinyl-container">

        <button
            class="vinyl"
            id="vinyl"
            onclick="togglePlay()"
            aria-label="Play or pause Deluxe Radio"
            aria-pressed="false"
        >

            <div class="vinyl-label">
                DELUXE
            </div>

            <div class="vinyl-hole"></div>

        </button>

    </div>



    <div class="song">

        <!-- <div class="song-kicker">
            TODAY'S RECORD
        </div> -->

        <div
            class="song-title"
            id="songTitle"
        >
            Ham tere pyaar me
        </div>


        <div
            class="song-artist"
            id="songArtist"
        >
            Lata Ji
        </div>


        <div
            class="song-note"
            id="songNote"
        >
            Today's record. Tomorrow, another one.
        </div>


        <button
            class="status"
            id="status"
            type="button"
            onclick="togglePlay()"
            aria-label="Play or pause Deluxe Radio"
        >
            PLAY
        </button>

    </div>

</main>



<footer>

    DELUXE RADIO · 2026

</footer>



<!-- Hidden YouTube player -->

<div
    id="youtubePlayer"
    style="
        position: fixed;
        width: 1px;
        height: 1px;
        left: -100px;
        top: -100px;
        opacity: 0;
        pointer-events: none;
    "
></div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =================================================
   RADIO DATA
================================================= */

const song = {

    title:
        "Ham tere pyaar me",

    artist:
        "Lata Ji",

    videoId:
        "Dvng8ZqJQb8",

    era:
        "A SONG FROM ANOTHER TIME",

    mood:
        "ROMANCE / NOSTALGIA",

    note:
         "Today's record. Tomorrow, another one."

};


/* =================================================
   VARIABLES
================================================= */

let youtubePlayer = null;

let playerReady = false;

let radioStarted = false;

let pendingPlay = false;


const vinyl =
    document.getElementById("vinyl");

const status =
    document.getElementById("status");

const radioHeading =
    document.getElementById("radioHeading");

const era =
    document.getElementById("era");

const mood =
    document.getElementById("mood");

const songNote =
    document.getElementById("songNote");


/* =================================================
   YOUTUBE READY
================================================= */

function onYouTubeIframeAPIReady() {

    youtubePlayer =
        new YT.Player(
            "youtubePlayer",
            {

                height: "1",

                width: "1",

                videoId:
                    song.videoId,

                playerVars: {

                    autoplay: 1,

                    controls: 0,

                    modestbranding: 1,

                    rel: 0,

                    playsinline: 1,

                    enablejsapi: 1

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

}


/* =================================================
   PLAYER READY
================================================= */

function onPlayerReady() {

    playerReady = true;

    /*
       The visual identity of Radio belongs
       to today's record.
    */

    songTitle.textContent =
        song.title;

    songArtist.textContent =
        song.artist;

    const titleWords =
        song.title
            .toUpperCase()
            .split(" ");

    const midpoint =
        Math.ceil(titleWords.length / 2);

    radioHeading.innerHTML =
        titleWords
            .slice(0, midpoint)
            .join(" ") +
        "<br>" +
        titleWords
            .slice(midpoint)
            .join(" ");

    era.textContent =
        song.era;

    mood.textContent =
        song.mood;

    songNote.textContent =
        song.note;

    /*
       The user arrived here by clicking
       DELUXE RADIO, so try to start immediately.
    */

    startRadio();

}


/* =================================================
   START RADIO
================================================= */

function startRadio() {

    if (!playerReady) {

        pendingPlay = true;

        return;

    }


    radioStarted = true;

    pendingPlay = false;

    status.textContent = "PLAY";

        status.classList.remove(
            "playing"
        );

    youtubePlayer.playVideo();

}


/* =================================================
   PLAY / PAUSE
================================================= */

function togglePlay() {

    if (!playerReady) {

        pendingPlay = true;

        status.textContent =
            "STARTING RADIO…";

        return;

    }


    if (!radioStarted) {

        startRadio();

        return;

    }


    const state =
        youtubePlayer.getPlayerState();


    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        youtubePlayer.pauseVideo();

    }

    else {

        youtubePlayer.playVideo();

    }

}


/* =================================================
   PLAYER STATE
================================================= */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        vinyl.classList.add(
            "playing"
        );

        vinyl.setAttribute(
            "aria-pressed",
            "true"
        );

        status.textContent =
            "PAUSE";

        status.classList.add(
            "playing"
        );

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        vinyl.classList.remove(
            "playing"
        );

        vinyl.setAttribute(
            "aria-pressed",
            "false"
        );

        status.textContent =
            "PLAY";

        status.classList.remove(
            "playing"
        );

    }


    else if (
        event.data ===
        YT.PlayerState.BUFFERING
    ) {

        status.textContent =
            "TUNING IN…";

        status.classList.remove(
            "playing"
        );

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        vinyl.classList.remove(
            "playing"
        );

        vinyl.setAttribute(
            "aria-pressed",
            "false"
        );

        radioStarted = false;

        status.textContent =
            "PLAY";

        status.classList.remove(
            "playing"
        );

    }

}


/* =================================================
   YOUTUBE ERRORS
================================================= */

function onPlayerError(event) {

    vinyl.classList.remove(
        "playing"
    );

    vinyl.setAttribute(
        "aria-pressed",
        "false"
    );

    radioStarted = false;


    const errors = {

        2:
            "INVALID YOUTUBE VIDEO",

        5:
            "THIS VIDEO CANNOT BE PLAYED",

        100:
            "VIDEO NOT FOUND OR REMOVED",

        101:
            "THIS VIDEO DOES NOT ALLOW EMBEDDING",

        150:
            "THIS VIDEO DOES NOT ALLOW EMBEDDING"

    };


    status.textContent =
        errors[event.data] ||
        "THIS SONG CANNOT BE PLAYED HERE";

    status.classList.remove(
        "playing"
    );

}


/* =================================================
   INITIAL STATE
================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        status.textContent = "";

    }
);

</script>


</body>

</html>
